<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">후보 8동 의료시설 이동시간 가정 시나리오 범위</title>
<desc id="desc">실제 도입 전후·인과효과·예측값이 아니라 의료시설까지의 공개 가정 시나리오다. HIRA 최근접 시설은 62개 돌봄서비스 목적지가 아니고 면적격자는 대상자 비율이 아니다. 버스 배차·환승·도로망·호출거절·공유승차 우회·요금·보행부담을 관측하지 않았으며, 5·10·15분 범위는 대기시간 한 축만 바꾼 시나리오 범위이지 신뢰구간이나 운영효과 범위가 아니다.</desc>
<style>
