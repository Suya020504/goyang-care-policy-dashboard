<text x="42" y="741" class="note">실제 도입 전후가 아니다. HIRA 최근접 시설·면적격자·분석자 가정으로 만든 비교 시나리오이며 62개 돌봄서비스와 대상자 도달률을 뜻하지 않는다.</text>
<text x="42" y="763" class="note">범위는 대기시간 한 축만 바꾼 값으로, 신뢰구간·운영효과·DRT 도입 성과가 아니다.</text>
